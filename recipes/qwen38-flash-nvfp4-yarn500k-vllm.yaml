recipe_version: "2"
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
runtime: vllm
container: ghcr.io/lancelind/qwen38-flash-dgx:latest
min_nodes: 1
max_nodes: 1

metadata:
  description: >-
    Qwen3.8-Flash-Next NVFP4 with YaRN rope scaling (factor 4) for ~500k
    context on a single DGX Spark. Same patched image as the base recipe.
  maintainer: lancelind
  model_vram: 76   # GB; PLE table is mmapped from NVMe, not resident
  kv_dtype: bf16

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: qwen3.8-flash-next
  max_model_len: 500000
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  # keep extra headroom for long prefills at 500k context
  gpu_memory_utilization: 0.80
  kv_cache_dtype: auto
  load_format: safetensors
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  # dict hf_overrides don't propagate to the MTP draft model, whose max_model_len
  # would stay 262144 — force it through the speculative config (see serve.sh).
  speculative_config: '{"method": "mtp", "num_speculative_tokens": 2, "max_model_len": 500000}'
  hf_overrides: '{"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 4.0, "original_max_position_embeddings": 262144}}}'
  compilation_config: '{"cudagraph_mode":"PIECEWISE","splitting_ops":["vllm::unified_attention_with_output","vllm::unified_mla_attention_with_output","vllm::mamba_mixer2","vllm::mamba_mixer","vllm::short_conv","vllm::qwen3_8_flash_next_ple_short_conv","vllm::qwen3_8_flash_next_qsa_with_output","vllm::linear_attention","vllm::qwen_gdn_attention_core","vllm::qwen_gdn_attention_core_fused_norm_packed","vllm::sparse_attn_indexer","vllm::ple_mmap_lookup"]}'

env:
  VLLM_PLE_MMAP: "1"
  VLLM_PLE_MMAP_WORKERS: "32"
  VLLM_PLE_MMAP_PREWARM: "0"
  VLLM_QSA_EXACT_TOPK: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --load-format {load_format} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --compilation-config '{compilation_config}' \
    --no-enable-flashinfer-autotune \
    --kv-cache-dtype {kv_cache_dtype} \
    --hf-overrides '{hf_overrides}' \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --speculative-config '{speculative_config}'
