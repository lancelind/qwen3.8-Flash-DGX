recipe_version: "2"
model: travelinlance/Qwen3.8-Flash-Next-RadixArk-NVFP4-Hybrid-Sharp
runtime: vllm
# Pinned by digest (= :latest as of 2026-08-31, built from main @ a35c3cc by CI)
# so the leaderboard submission references an immutable image. Bump on release.
container: ghcr.io/lancelind/qwen38-flash-dgx@sha256:62a77b7c2806385cd23aeb7f6c4979b29f1b0db941bdc0f4791da90aa15f5bb9
min_nodes: 1
max_nodes: 1

# The base image's ENTRYPOINT is ["vllm","serve"] (no setup wrapper), which
# would consume sparkrun's `bash -c` launcher — run our full command instead.
executor_config:
  entrypoint: ""

metadata:
  description: >-
    Qwen3.8-Flash-Next (~176B MoE) on a single DGX Spark / GB10. Model card:
    https://huggingface.co/travelinlance/Qwen3.8-Flash-Next-RadixArk-NVFP4-Hybrid-Sharp
    — RadixArk's ModelOpt NVFP4 quantization with two additions by
    travelinlance: ~15 GiB of per-token side layers (attention projections,
    shared experts) converted to blockwise fp8-e4m3 (~20% faster decode,
    conversion tool by @Saren-Arterius), and the Sharp chat template
    (peculiar-ragdoll, froggeric v22.1 line; ~18% fewer output tokens).
    Serving image ghcr.io/lancelind/qwen38-flash-dgx (source:
    https://github.com/lancelind/qwen3.8-Flash-DGX, fork of
    https://github.com/blazux/qwen3.8-Flash-DGX) layers on the official
    vllm-openai qwen38-flash-next image: PLE n-gram table served from NVMe
    via mmap (blazux — what makes 176B fit in 128 GB); v2 GPU table gather
    (lancelind): a CUDA kernel reads the mmap'd table directly through ATS
    inside the piecewise CUDA graphs, with decode-ahead page-cache warming,
    replacing the CPU gather; GB10 FLA shared-memory/warp fixes, mamba
    state-copy guard and fast gather path (@Saren-Arterius); mamba race fix
    vllm#50729 (@AndreasKaratzas); prefix-caching block_size fix and exact
    deterministic QSA top-k (blazux, vllm#51782 reported by @k3dani); NVFP4 +
    fp8 hybrid loader; fp8_e4m3 KV cache option (@Nanetnounou, inert here);
    tool_choice required/named enforcement fix (lancelind). Config measured
    on-box 2026-08-30/31 UTC (C=1/2/5/10, max_num_seqs 8, 2048-in/256-out):
    speculative decoding OFF (MTP costs aggregate throughput at concurrency
    on this bandwidth-bound part) and gpu_memory_utilization 0.75 (frees
    ~14 GB for the page cache serving the 47.7 GiB table). vs the v1 CPU
    gather recipe: sum decode 21->21, 28->36, 33->58, 38->76 tok/s at
    C=1/2/5/10; C=1 TTFT P99 4003 -> 1313 ms; GPU SM 96% sustained. No
    manual prep: the gather kernel ships compiled in the image.
  maintainer: lancelind
  # VRAM override (units: GB): hybrid side layers cut resident weights below
  # the nvfp4 build's ~76 GB; PLE table lives on NVMe via mmap.
  model_vram: 69
  kv_dtype: bf16

defaults:
  port: 8000
  host: 0.0.0.0
  served_model_name: qwen3.8-flash-next
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  # 0.75, not 0.85: vLLM's reservation competes with the OS page cache that
  # serves the mmap'd PLE table. Measured across 0.70-0.90: decode is
  # cache-insensitive, but every GB returned to the cache tightens TTFT
  # (C=1 P99 4.3 s at 0.85 -> 1.3 s at 0.75); KV still fits 262k context.
  gpu_memory_utilization: 0.75
  kv_cache_dtype: auto        # keep auto (=bf16): fp8 is refused by the QSA layers
  load_format: safetensors
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  # v2: `vllm::ple_mmap_lookup` is NOT a splitting op. Captured decode steps
  # run the GPU (ATS) gather inside the piecewise CUDA graphs; everything
  # outside capture runs as page-cache warm + the same GPU gather (the module
  # branches on stream-capture state; with VLLM_PLE_GPU_GATHER=1 a missing
  # kernel fails the boot rather than falling back).
  compilation_config: '{"cudagraph_mode":"PIECEWISE","splitting_ops":["vllm::unified_attention_with_output","vllm::unified_mla_attention_with_output","vllm::mamba_mixer2","vllm::mamba_mixer","vllm::short_conv","vllm::qwen3_8_flash_next_ple_short_conv","vllm::qwen3_8_flash_next_qsa_with_output","vllm::linear_attention","vllm::qwen_gdn_attention_core","vllm::qwen_gdn_attention_core_fused_norm_packed","vllm::sparse_attn_indexer"]}'

env:
  VLLM_PLE_MMAP: "1"            # serve the PLE table from disk
  VLLM_PLE_GPU_GATHER: "1"      # decode gathers as a GPU kernel via ATS (v2)
  VLLM_PLE_DECODE_WARM: "1"     # hash + pre-warm decode rows off-path
  VLLM_PLE_MMAP_WORKERS: "32"
  VLLM_PLE_MMAP_PREWARM: "0"
  VLLM_QSA_EXACT_TOPK: "1"      # deterministic top-k
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_FP8_HYBRID: "1"          # enable the fp8 side-layer dispatch
  VLLM_USE_DEEP_GEMM: "0"       # required with hybrid mode (see serve.sh)

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --load-format {load_format} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --compilation-config '{compilation_config}' \
    --no-enable-flashinfer-autotune \
    --kv-cache-dtype {kv_cache_dtype} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser}
