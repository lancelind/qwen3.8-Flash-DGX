name: Build and push image

on:
  push:
    branches: [main, ple-gpu-lookup]
    tags: ["v*"]
    paths-ignore: ["recipes/**", "docs/**", "README.md", ".sparkrun/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # The base vllm image is arm64 (Spark's Grace CPU) — build on an arm64 runner.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The vLLM base image is tens of GB; reclaim as much runner disk as possible.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/qwen38-flash-dgx
          # `latest` publishes only from main; branch pushes get only the
          # immutable per-commit sha tag, so a recipe/benchmark can be pinned
          # to the exact image it ran against.
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
